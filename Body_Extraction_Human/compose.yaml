services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: body_extraction
      POSTGRES_USER: body_app
      POSTGRES_PASSWORD: ${BODY_PG_PASSWORD:?Set BODY_PG_PASSWORD}
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - body_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U body_app -d body_extraction"]
      interval: 5s
      retries: 12
volumes:
  body_database:
